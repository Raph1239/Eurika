<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>InfiniScroll</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA / add-to-homescreen -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0a0a0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="InfiniScroll" />
</head>
<body>
  <div id="dev-counter" title="Anthropic API calls made this session (dev-only)">
    API calls: <span id="dev-counter-value">0</span>
  </div>

  <div id="corner-nav">
    <button id="stats-btn" type="button" aria-label="View your topic stats">
      <svg viewBox="0 0 24 24" class="stats-icon">
        <rect x="4" y="11" width="4" height="9" rx="1" />
        <rect x="10" y="6" width="4" height="14" rx="1" />
        <rect x="16" y="2" width="4" height="18" rx="1" />
      </svg>
    </button>
    <button id="favorites-btn" type="button" aria-label="View your liked posts" aria-pressed="false">
      <svg viewBox="0 0 24 24" class="favorites-icon">
        <path
          d="M12 21s-6.72-4.36-9.33-8.2C.99 9.98 1.9 6 5.4 6c2.02 0 3.31 1.15 3.9 2.15C9.9 7.15 11.2 6 13.2 6c3.5 0 4.42 3.98 2.73 6.8C19.72 16.64 12 21 12 21z"
        />
      </svg>
    </button>
  </div>

  <main id="feed" class="feed"></main>
  <main id="favorites-feed" class="feed feed-hidden"></main>

  <div id="stats-overlay" class="stats-overlay hidden">
    <div class="stats-panel">
      <div class="stats-header">
        <h2>Your Top Topics</h2>
        <button id="stats-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="stats-body" class="stats-body"></div>
    </div>
  </div>

  <template id="post-template">
    <section class="post">
      <div class="post-topic"></div>
      <p class="post-text"></p>
      <div class="post-meta">
        <span class="post-avatar"></span>
        <span class="post-author"></span>
        <span class="post-dot">&middot;</span>
        <span class="post-timestamp"></span>
      </div>
      <div class="post-replies"></div>
      <div class="action-rail">
        <button class="skip-btn" type="button" aria-label="Not interested" aria-pressed="false">
          <svg class="skip-icon" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <button class="like-btn" type="button" aria-label="Like this post" aria-pressed="false">
          <svg class="heart-icon" viewBox="0 0 24 24">
            <path
              d="M12 21s-6.72-4.36-9.33-8.2C.99 9.98 1.9 6 5.4 6c2.02 0 3.31 1.15 3.9 2.15C9.9 7.15 11.2 6 13.2 6c3.5 0 4.42 3.98 2.73 6.8C19.72 16.64 12 21 12 21z"
            />
          </svg>
        </button>
        <button class="share-btn" type="button" aria-label="Share this post">
          <svg class="share-icon" viewBox="0 0 24 24">
            <polyline points="16 6 12 2 8 6" />
            <line x1="12" y1="2" x2="12" y2="15" />
            <path d="M20 15v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5" />
          </svg>
        </button>
      </div>
    </section>
  </template>

  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <span>Loading more posts&hellip;</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
